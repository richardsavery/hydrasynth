name: Mac and Linux compatibility

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to check
        type: choice
        default: all
        options:
          - all
          - ubuntu-24.04
          - macos-15
          - macos-15-intel

permissions:
  contents: read

jobs:
  platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'all' && '["ubuntu-24.04","macos-15","macos-15-intel"]' || format('["{0}"]', inputs.platform)) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install the app and Whisper
        run: bash tools/setup.sh --no-key
      - name: Run native and dashboard tests
        run: make test
